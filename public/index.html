  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,sans-serif;background:#f8f9fa;color:#111;line-height:1.5}:root{--orange:#FE6B35;--orange-light:#fff8f5;--orange-border:#fed7c7;--danger:#dc2626;--danger-light:#fef2f2;--danger-border:#fecaca;--gray-50:#f8f9fa;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-500:#666;--gray-900:#111}.auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}.auth-card{background:#fff;border-radius:24px;padding:48px;max-width:400px;width:90%;border:1px solid var(--gray-200);box-shadow:0 20px 60px rgba(0,0,0,.08)}.auth-header{text-align:center;margin-bottom:32px}.auth-title{font-size:28px;font-weight:700;margin:16px 0 8px}.auth-subtitle{font-size:15px;color:var(--gray-500)}.form{display:flex;flex-direction:column;gap:20px}.input-group{display:flex;flex-direction:column;gap:6px}.label{font-size:13px;font-weight:600;color:#333}.input{padding:14px 16px;border-radius:10px;border:1px solid var(--gray-200);font-size:15px;outline:0;font-family:inherit;width:100%}.input:focus{border-color:var(--orange)}select.input{cursor:pointer}.btn{padding:14px 24px;border-radius:12px;border:0;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}.btn:hover{opacity:.9}.btn-primary{background:var(--orange);color:#fff}.btn-secondary{background:#fff;color:#333;border:1px solid var(--gray-200);padding:10px 20px}.btn-danger{background:var(--danger);color:#fff}.btn-cancel{background:var(--danger-light);color:var(--danger);border:1px solid var(--danger-border);padding:8px 16px;font-size:13px}.btn-small{padding:4px 10px;font-size:12px;border-radius:6px}.app{min-height:100vh;background:var(--gray-50)}.header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:#fff;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:16px}.header-left{display:flex;align-items:center;gap:12px}.logo-text{font-size:20px;font-weight:700}.logo-text span{color:var(--orange)}.nav{display:flex;gap:4px;background:var(--gray-100);border-radius:10px;padding:4px}.nav-btn{padding:10px 20px;border:0;background:0 0;color:var(--gray-500);font-size:14px;font-weight:500;cursor:pointer;border-radius:8px;font-family:inherit}.nav-btn.active{background:#fff;color:var(--orange);box-shadow:0 1px 3px rgba(0,0,0,.1)}.header-right{display:flex;align-items:center;gap:16px}.user-info{display:flex;flex-direction:column;align-items:flex-end}.user-name{font-size:14px;font-weight:600}.user-role{font-size:12px;color:var(--gray-500);text-transform:capitalize}.icon-btn{padding:10px;border:0;background:var(--gray-100);border-radius:8px;cursor:pointer;font-size:16px;position:relative}.badge{position:absolute;top:-4px;right:-4px;background:var(--orange);color:#fff;font-size:11px;padding:2px 6px;border-radius:10px}.logout-btn{padding:10px 16px;border:1px solid var(--gray-200);background:#fff;border-radius:8px;color:var(--gray-500);font-size:13px;cursor:pointer;font-family:inherit}.main{padding:32px;max-width:1200px;margin:0 auto}.section{padding:28px;background:#fff;border-radius:20px;border:1px solid var(--gray-200);margin-bottom:24px}.section-title{margin:0 0 20px;font-size:18px;font-weight:600}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}.stat-card{display:flex;align-items:center;gap:16px;padding:24px;background:#fff;border-radius:16px;border:1px solid var(--gray-200)}.stat-icon{font-size:32px}.stat-value{font-size:28px;font-weight:700}.stat-label{font-size:13px;color:var(--gray-500)}.progress-section{padding:24px;background:#fff;border-radius:16px;border:1px solid var(--gray-200);margin-bottom:24px}.progress-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--gray-500)}.progress-bar{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:var(--orange);border-radius:4px;transition:width .3s}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:600px){.form-row{grid-template-columns:1fr}}.preview{padding:12px 16px;border-radius:10px;font-size:14px}.preview-info{background:var(--orange-light);border:1px solid var(--orange-border);color:#333}.preview-error{background:var(--danger-light);border:1px solid var(--danger-border);color:var(--danger);font-weight:500}.preview-warning{background:#fefce8;border:1px solid #fde047;color:#854d0e;font-weight:500}.card{display:flex;align-items:center;gap:16px;padding:20px;background:var(--gray-50);border-radius:12px;border:1px solid var(--gray-200);margin-bottom:12px;flex-wrap:wrap}.card-content{flex:1;min-width:200px}.card-title{font-weight:600;color:var(--gray-900)}.card-subtitle{font-size:14px;color:var(--gray-500)}.card-meta{font-size:13px;color:var(--gray-400)}.blackout-card{padding:16px 20px;background:var(--danger-light);border-radius:12px;border:1px solid var(--danger-border);margin-bottom:12px}.blackout-title{font-weight:600;color:var(--danger)}.avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}.avatar-sm{width:40px;height:40px;font-size:16px}.badge-you{padding:2px 8px;background:var(--orange);border-radius:6px;font-size:11px;color:#fff;font-weight:600}.badge-admin{padding:2px 8px;background:var(--orange-light);border-radius:6px;font-size:11px;color:var(--orange);border:1px solid var(--orange-border);margin-right:8px}.empty{padding:40px;text-align:center;color:var(--gray-400);font-size:14px}.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.team-card{display:flex;align-items:center;gap:16px;padding:20px;background:#fff;border-radius:16px;border:1px solid var(--gray-200)}.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2 00;padding:20px}.modal{background:#fff;border-radius:20px;padding:32px;max-width:400px;width:100%}.modal-title{margin:0 0 20px;font-size:20px;font-weight:600}.notification-panel{position:fixed;top:70px;right:32px;width:360px;max-width:calc(100vw - 64px);max-height:400px;overflow-y:auto;background:#fff;border-radius:16px;border:1px solid var(--gray-200);box-shadow:0 20px 60px rgba(0,0,0,.15);padding:20px;z-index:200}.notification-item{padding:12px;border-radius:8px;margin-bottom:8px;border:1px solid var(--gray-200)}.notification-item.unread{background:var(--orange-light)}.notification-message{margin:0 0 4px;font-size:14px}.notification-time{font-size:12px;color:var(--gray-400)}.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px}.alert-error{background:var(--danger-light);border:1px solid var(--danger-border);color:var(--danger)}.alert-success{background:#dcfce7;border:1px solid #86efac;color:#166534}.manage-card{display:flex;align-items:center;justify-content:space-between;padding:20px;background:var(--gray-50);border-radius:12px;border:1px solid var(--gray-200);margin-bottom:12px;flex-wrap:wrap;gap:16px}.manage-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.demo-note{font-size:12px;color:var(--gray-400);text-align:center}.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gray-500)}.hidden{display:none!important}.activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:8px;margin-bottom:8px;background:var(--gray-50);border:1px solid var(--gray-200)}.activity-icon{font-size:20px;flex-shrink:0}.activity-content{flex:1;min-width:0}.activity-desc{font-size:14px;color:var(--gray-900)}.activity-meta{font-size:12px;color:var(--gray-400);margin-top:4px}@media (max-width:768px){.header{padding:16px}.main{padding:16px}.nav{overflow-x:auto}.calendar-grid{font-size:12px}.calendar-day{min-height:60px;padding:4px}}
